# Cloudflare Workers Builds deploys from the repository root using this file.
name = "luminous-orbis-server"
main = "server/src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["World"]
